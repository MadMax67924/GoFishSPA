name: CI Pipeline

on:
  push:
    branches:
      - respaldo3_baseordenada2
  pull_request:

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3
      - name: Verificar versión de Node
        run: node -v
      - name: Instalar dependencias
        run: npm install
      - name: Instalar mysql2        
        run: npm install mysql2
      - name: Preparar datos (db:setup)
        run: npm run db:setup

      - name: Compilar proyecto
        run: npm run build
      - name: Ejecutar pruebas
        run: npm test

