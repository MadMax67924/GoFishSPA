name: CI Pipeline

on:
  push:
    branches:
      - respaldo3_baseordenada2
  pull_request:

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Ir al directorio del frontend
        run: cd frontend

      - name: Instalar dependencias
        run: npm install
        working-directory: ./frontend

      - name: Instalar mysql2 (si lo necesitas)
        run: npm install mysql2
        working-directory: ./frontend

      - name: Preparar datos
        run: npm run db:setup
        working-directory: ./frontend

      - name: Compilar proyecto
        run: npm run build
        working-directory: ./frontend